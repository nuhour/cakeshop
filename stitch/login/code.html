                    },
                    "fontFamily": {
                        "label-sm": ["beVietnamPro"],
                        "label-price": ["notoSerif"],
                        "display-md": ["notoSerif"],

<style>
        body {
            background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E');
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-surface-variant/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-surface-container-high/40 rounded-full blur-3xl pointer-events-none"></div>
<main class="w-full max-w-md px-margin-page py-stack-lg z-10 flex flex-col h-full justify-between sm:justify-center sm:min-h-[600px] bg-surface-container-lowest/50 sm:bg-transparent backdrop-blur-sm sm:backdrop-blur-none rounded-xl sm:shadow-[0_4px_24px_rgba(58,54,48,0.02)] sm:border border-outline-variant/10">
<!-- Brand Area -->
<header class="flex flex-col items-center pt-12 pb-16 space-y-6">
<div class="w-16 h-16 flex items-center justify-center border border-outline-variant/30 rounded-lg bg-surface relative overflow-hidden shadow-[0_2px_12px_rgba(58,54,48,0.04)]">
<span class="vertical-text font-display-md text-display-md tracking-widest text-primary relative z-10">如也</span>
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-variant opacity-50"></div>
</div>
<div class="flex flex-col items-center space-y-2 text-on-surface-variant">
<p class="font-headline-sm text-headline-sm tracking-widest">一期一会</p>
<div class="h-px w-8 bg-outline-variant/50"></div>
<p class="font-label-sm text-label-sm opacity-80">SLOW LIVING & ELEGANCE</p>
</div>
</header>
<!-- Login Form -->
<form class="flex flex-col space-y-stack-lg w-full mt-4 flex-grow sm:flex-grow-0" onsubmit="event.preventDefault();">
<div class="space-y-stack-md">
<!-- Phone Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-300 pointer-events-none text-[20px]">smartphone</span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 focus:border-primary focus:ring-0 pl-8 pb-2 text-on-background placeholder:text-outline-variant/70 font-body-lg text-body-lg transition-colors duration-300" placeholder="请输入手机号" type="tel"/>
</div>
<!-- Verification Code Input -->
<div class="relative group flex items-end">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-300 pointer-events-none text-[20px]">lock</span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 focus:border-primary focus:ring-0 pl-8 pb-2 text-on-background placeholder:text-outline-variant/70 font-body-lg text-body-lg transition-colors duration-300 pr-24" placeholder="请输入验证码" type="text"/>
<button class="absolute right-0 bottom-2 font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" type="button">获取验证码</button>
</div>
</div>
<!-- Login Buttons -->
<div class="flex flex-col space-y-stack-sm pt-4">
<button class="w-full bg-primary-container text-on-primary-container py-3 rounded-lg font-headline-sm text-headline-sm tracking-widest hover:bg-primary-container/90 transition-colors shadow-sm flex items-center justify-center space-x-2 group relative overflow-hidden" type="submit">
<span class="relative z-10">登 录</span>
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-outline">或</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full bg-[#07C160] text-white py-3 rounded-lg font-headline-sm text-headline-sm tracking-widest hover:bg-[#06ad56] transition-colors shadow-sm flex items-center justify-center space-x-2" type="button">
<span class="material-symbols-outlined text-[20px]">chat</span>
<span>微信一键登录</span>
</button>
</div>
<!-- User Agreement -->
<div class="flex items-start space-x-2 mt-auto sm:mt-6 pt-8 pb-4">
<div class="pt-0.5">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary focus:ring-offset-background bg-transparent cursor-pointer" id="agreement" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant/80 cursor-pointer select-none leading-relaxed" for="agreement">
                    我已阅读并同意
                    <a class="text-secondary hover:text-primary underline decoration-outline-variant/50 underline-offset-4 transition-colors" href="#">《用户服务协议》</a>
                    与
                    <a class="text-secondary hover:text-primary underline decoration-outline-variant/50 underline-offset-4 transition-colors" href="#">《隐私政策》</a>
</label>
</div>
</form>
</main>
</body></html>
