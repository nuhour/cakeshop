<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>我的优惠券</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Noto+Serif:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#795b3c",
                        "surface-tint": "#a33c2e",
                        "surface-dim": "#e1d9d0",
                        "inverse-surface": "#34302a",
                        "primary-fixed": "#ffdad4",
                        "secondary-container": "#ffd5af",
                        "on-tertiary-fixed": "#201b12",
                        "on-tertiary-container": "#f7edde",
                        "outline": "#8a716d",
                        "surface-variant": "#e9e1d8",
                        "on-secondary-fixed-variant": "#5c4125",
                        "surface-container": "#f5ede4",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#77583a",
                        "tertiary-container": "#726b5f",
                        "on-primary-fixed-variant": "#83251a",
                        "secondary-fixed": "#ffdcbd",
                        "on-surface-variant": "#57423e",
                        "on-secondary-fixed": "#2b1701",
                        "tertiary-fixed": "#ebe1d3",
                        "surface": "#fff8f2",
                        "inverse-on-surface": "#f8efe6",
                        "surface-container-highest": "#e9e1d8",
                        "secondary-fixed-dim": "#e7bf9a",
                        "on-surface": "#1e1b16",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#ffe9e6",
                        "tertiary-fixed-dim": "#cfc5b8",
                        "background": "#fff8f2",
                        "on-tertiary-fixed-variant": "#4c463c",
                        "inverse-primary": "#ffb4a8",
                        "primary-container": "#b5493a",
                        "on-secondary": "#ffffff",
                        "on-background": "#1e1b16",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#410000",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#ffb4a8",
                        "outline-variant": "#dec0bb",
                        "error-container": "#ffdad6",
                        "primary": "#953225",
                        "tertiary": "#595348",
                        "surface-bright": "#fff8f2",
                        "surface-container-high": "#efe7de",
                        "surface-container-low": "#fbf2e9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "unit": "4px",
                        "stack-lg": "32px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "margin-page": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["Be Vietnam Pro", "sans-serif"],
                        "label-price": ["Noto Serif", "serif"],
                        "display-md": ["Noto Serif", "serif"],
                        "body-lg": ["Be Vietnam Pro", "sans-serif"],
                        "headline-sm": ["Noto Serif", "serif"],
                        "body-md": ["Be Vietnam Pro", "sans-serif"],
                        "display-lg": ["Noto Serif", "serif"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "label-price": ["18px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "display-md": ["24px", { "lineHeight": "1.4", "letterSpacing": "0.08em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "0.02em", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "1.5", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "1.4", "letterSpacing": "0.1em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom Coupon Edge Effect */
        .coupon-edge {
            position: relative;
        }
        .coupon-edge::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: -4px;
            width: 8px;
            background: radial-gradient(circle at 0 50%, transparent 4px, #ffffff 4.5px);
            background-size: 8px 16px;
            background-repeat: repeat-y;
            z-index: 10;
        }
        
        .coupon-divider {
            border-left: 1px dashed var(--tw-colors-outline-variant);
            opacity: 0.5;
        }

        /* Ambient Shadow for Cards */
        .ambient-shadow {
            box-shadow: 0 4px 20px rgba(58, 54, 48, 0.04);
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-md sticky top-0 z-40 border-b border-outline-variant/30 docked full-width">
<div class="flex justify-between items-center w-full px-margin-page py-4 max-w-7xl mx-auto">
<button aria-label="Go back" class="text-primary dark:text-inverse-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back_ios</span>
</button>
<h1 class="font-display-md text-display-md tracking-widest text-primary dark:text-on-primary-fixed-variant">我的优惠券</h1>
<button aria-label="Help" class="text-primary dark:text-inverse-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help_outline</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 max-w-3xl mx-auto w-full px-margin-page py-stack-md flex flex-col gap-stack-lg pb-32">
<!-- Tabs -->
<nav aria-label="Coupon Tabs" class="flex w-full border-b border-outline-variant/30 relative">
<button class="flex-1 py-3 text-center relative group">
<span class="font-headline-sm text-headline-sm text-primary font-medium">待使用</span>
<div class="absolute bottom-[-1px] left-1/2 -translate-x-1/2 w-8 h-[2px] bg-primary rounded-t-full"></div>
</button>
<button class="flex-1 py-3 text-center text-on-surface-variant hover:text-primary transition-colors">
<span class="font-headline-sm text-headline-sm">已使用</span>
</button>
<button class="flex-1 py-3 text-center text-on-surface-variant hover:text-primary transition-colors">
<span class="font-headline-sm text-headline-sm">已过期</span>
</button>
</nav>
<!-- Coupons List -->
<div class="flex flex-col gap-stack-md">
<!-- Coupon Card 1 -->
<article class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 ambient-shadow flex overflow-hidden relative">
<!-- Decorative Corner -->
<div class="absolute top-0 right-0 w-16 h-16 pointer-events-none opacity-20" style="background: linear-gradient(135deg, transparent 50%, var(--tw-colors-primary-container) 50%);"></div>
<!-- Left: Value -->
<div class="w-32 bg-surface-container-lowest flex flex-col items-center justify-center p-4 relative z-10">
<div class="text-primary-container flex items-baseline">
<span class="font-label-sm text-label-sm mr-1">¥</span>
<span class="font-display-lg text-display-lg">50</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">满200元可用</span>
</div>
<!-- Right: Details -->
<div class="flex-1 bg-surface-container-lowest coupon-edge coupon-divider p-4 pl-6 flex flex-col justify-between relative z-10">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="px-2 py-[2px] border border-secondary text-secondary font-label-sm text-label-sm rounded text-[10px]">新人专享</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">春季茗茶礼券</h3>
</div>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-1">适用于全场茶叶商品，特价商品除外</p>
</div>
<div class="flex justify-between items-end mt-4">
<span class="font-label-sm text-label-sm text-tertiary">2023.04.01 - 2023.05.01</span>
<button class="bg-primary-container text-on-primary px-4 py-1.5 rounded font-label-sm text-label-sm hover:opacity-90 transition-opacity">
                            去使用
                        </button>
</div>
</div>
</article>
<!-- Coupon Card 2 -->
<article class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 ambient-shadow flex overflow-hidden relative">
<!-- Left: Value -->
<div class="w-32 bg-surface-container-lowest flex flex-col items-center justify-center p-4 relative z-10">
<div class="text-primary-container flex items-baseline">
<span class="font-label-sm text-label-sm mr-1">¥</span>
<span class="font-display-lg text-display-lg">20</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">无门槛</span>
</div>
<!-- Right: Details -->
<div class="flex-1 bg-surface-container-lowest coupon-edge coupon-divider p-4 pl-6 flex flex-col justify-between relative z-10">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="px-2 py-[2px] border border-secondary text-secondary font-label-sm text-label-sm rounded text-[10px]">运费券</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">首单包邮券</h3>
</div>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-1">抵扣单次常规配送费用</p>
</div>
<div class="flex justify-between items-end mt-4">
<span class="font-label-sm text-label-sm text-tertiary">长期有效</span>
<button class="bg-primary-container text-on-primary px-4 py-1.5 rounded font-label-sm text-label-sm hover:opacity-90 transition-opacity">
                            去使用
                        </button>
</div>
</div>
</article>
</div>
<!-- Empty State (Hidden, for logic illustration) -->
<div class="hidden flex-col items-center justify-center py-12 opacity-60">
<span class="material-symbols-outlined text-[64px] text-tertiary mb-4" style="font-variation-settings: 'FILL' 0;">inbox</span>
<p class="font-body-lg text-body-lg text-tertiary">暂无可用优惠券</p>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-sm border-t border-outline-variant/20 px-margin-page py-4 pb-safe z-40 hidden md:block">
<div class="max-w-3xl mx-auto">
<button class="w-full bg-surface-container-lowest border-2 border-primary-container text-primary-container font-headline-sm text-headline-sm py-3 rounded-lg hover:bg-primary-container/5 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">confirmation_number</span>
                去领券中心
            </button>
</div>
</div>
<!-- Mobile Bottom Fixed Button (Overrides BottomNavBar for transactional flow) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-sm border-t border-outline-variant/20 px-margin-page py-4 z-40 md:hidden">
<button class="w-full bg-surface-container-lowest border border-primary-container text-primary-container font-headline-sm text-headline-sm py-3 rounded hover:bg-primary-container/5 transition-colors flex items-center justify-center gap-2">
            去领券中心
        </button>
</div>
</body></html>
