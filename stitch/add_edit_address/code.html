<style>

<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:ring-0 px-0 py-3 text-on-surface font-body-lg placeholder-tertiary-fixed-dim transition-colors peer" id="contact_name" placeholder="收货人姓名" required="" type="text"/>
<div class="input-line absolute bottom-0 left-0 w-full h-[2px] bg-primary"></div>
</div>
<!-- Phone Input -->
<div class="relative group mt-2">
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:ring-0 px-0 py-3 text-on-surface font-body-lg placeholder-tertiary-fixed-dim transition-colors peer" id="contact_phone" placeholder="手机号码" required="" type="tel"/>
<div class="input-line absolute bottom-0 left-0 w-full h-[2px] bg-primary"></div>
</div>
</div>
<hr class="border-outline-variant/20 my-2"/>

<div class="flex flex-col gap-stack-md">
<h2 class="font-headline-sm text-headline-sm text-secondary flex items-center gap-2">
<span class="material-symbols-outlined text-outline">location_on</span>
                    地址详情
                </h2>
<!-- Region Selector (Simulated Cascade) -->
<div class="relative group mt-2 cursor-pointer">
<div class="flex justify-between items-center border-b border-outline-variant py-3 group-hover:border-outline transition-colors">
<span class="text-tertiary-fixed-dim font-body-lg group-hover:text-tertiary transition-colors">所在地区 (省、市、区/县)</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-outline transition-colors">chevron_right</span>
</div>
<div class="input-line absolute bottom-0 left-0 w-full h-[2px] bg-primary"></div>
</div>
<!-- Detailed Address -->
<div class="relative group mt-2">
<textarea class="w-full bg-transparent border-0 border-b border-outline-variant focus:ring-0 px-0 py-3 text-on-surface font-body-lg placeholder-tertiary-fixed-dim transition-colors peer resize-none" id="detailed_address" placeholder="详细地址 (如街道、门牌号、小区、楼栋号、单元等)" required="" rows="2"></textarea>
<div class="input-line absolute bottom-[4px] left-0 w-full h-[2px] bg-primary"></div>
</div>
</div>
<hr class="border-outline-variant/20 my-2"/>
<!-- Settings Group -->
<div class="flex flex-col gap-stack-md">
