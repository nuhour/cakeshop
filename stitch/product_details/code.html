<!-- Top Navigation (Contextual departure page, no global nav shell needed, just a back button header) -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/20 px-margin-page py-4 flex items-center justify-between transition-opacity">
<button aria-label="Go back" class="text-on-surface hover:text-primary transition-colors flex items-center justify-center p-2 -ml-2">

</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-widest">商品详情</h1>

<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></div>

</section>

<span class="font-label-price text-label-price text-primary">¥288</span>

</div>

<span class="material-symbols-outlined text-primary text-[14px]" style="font-variation-settings: 'FILL' 1;">schedule</span>
